name: solver-api CI

on:
  push:
    branches: [main]
    paths:
      - "apps/solver-api/**"
      - "packages/solver-contracts/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/solver-api/**"
      - "packages/solver-contracts/**"

permissions:
  contents: read

concurrency:
  group: solver-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # テスト/lint は ci.yml の test-python ジョブで実施済み
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build & push image
        run: |
          IMAGE=asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/solver-api/solver-api:${{ github.sha }}
          docker build -t $IMAGE apps/solver-api
          docker push $IMAGE

      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ github.event.repository.name }}-solver-api
          region: asia-northeast1
          image: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/solver-api/solver-api:${{ github.sha }}
          flags: "--allow-unauthenticated"
          env_vars: |
            SOLVE_TIMEOUT_MS=25000
          secrets: |
            SOLVER_API_KEY=SOLVER_API_KEY:latest
